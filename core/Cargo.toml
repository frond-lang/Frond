[package]
name = "frond"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
# Cross-platform allocator (Microsoft, MSVC/GCC/Clang, x64/arm64): the engine
# and compiler are allocation-heavy (frames, HashMaps, strings); mimalloc's
# thread-local free lists beat the system allocator on Windows.
mimalloc = "0.1"
bumpalo = { version = "3", features = ["collections"] }
wide = "1.7.0"
parking_lot = "0.12"
rayon = "1"
rustc-hash = "2.1"
hashbrown = "0.17"
clap = { version = "4.6", features = ["derive"] }
pastey = "0.2"
num_enum = "0.7"
strum = { version = "0.28.0", features = ["derive"] }
toml = "0.9.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memmap2 = "0.9"
zerocopy = { version = "0.8", features = ["derive"] }

[build-dependencies]
cc = { version = "1.0", features = ["parallel"] }

[[bin]]
name = "frond"
path = "src/main.rs"

[lib]
name = "frond"
path = "src/lib.rs"
