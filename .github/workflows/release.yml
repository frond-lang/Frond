name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Only run when the tag is created from the main branch (or manually dispatched).
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.event.base_ref == 'refs/heads/main')

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: kuzo
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: kuzo
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: kuzo
            archive: tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: kuzo
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: kuzo.exe
            archive: zip

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../kuzo-${{ matrix.target }}.tar.gz ${{ matrix.artifact }}

      - name: Package (windows)
        if: matrix.archive == 'zip'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../kuzo-${{ matrix.target }}.zip ${{ matrix.artifact }}

      - name: Generate checksum
        run: |
          if [ "${{ matrix.archive }}" = "tar.gz" ]; then
            shasum -a 256 kuzo-${{ matrix.target }}.tar.gz > kuzo-${{ matrix.target }}.tar.gz.sha256
          else
            sha256sum kuzo-${{ matrix.target }}.zip > kuzo-${{ matrix.target }}.zip.sha256
          fi
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kuzo-${{ matrix.target }}
          path: |
            kuzo-${{ matrix.target }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*
