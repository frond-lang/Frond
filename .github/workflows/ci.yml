# CI — 跨平台一致性的执法者(BOOTSTRAP_PLAN.md 4d):
#   suite          五平台矩阵跑 functional + negative + await_loop 稳定性电池
#                  (linux-x64/linux-arm64/macos-arm64/macos-x64[Rosetta]/windows-x64)
#   eventloop      同矩阵 FROND_EVENTLOOP=1 跑 functional + 电池 + diff_load
#                  (确定性事件循环 M2 灰度 soak:两调度器同门禁同口径)
#   differential   四平台跑镜像差分 diff_lex/diff_ast/diff_load(Rust 引擎
#                  vs frondc 逐字节);differential-heavy 在 linux-x64 加
#                  diff_tyops + diff_sema(重负载)
#   suite-musl     linux musl 静态链接:套件(FROND_SKIP 掉无 LLVM 发行物
#                  的三套)——libc/分配器面差异的额外覆盖
#   build-windows-arm64  aarch64-pc-windows-msvc 交叉构建(实验性,只验编译)
#
# release.yml 只构建打包;同源同行为由本矩阵保证。
# 布局约定(与本地开发一致,scripts 以 ../../Frond/... 定位二进制):
#   <workspace>/Frond   本仓库(checkout 默认)
#   <workspace>/tests   frond-lang/tests
#   <workspace>/apps    frond-lang/apps(llvmfetch 预取 + 差分语料)
# 所有 runner 经 FROND 环境变量指定引擎二进制(脚本默认找 frond.exe);
# 公共 checkout/构建步骤收拢在 .github/actions/setup-frond。

name: CI

on:
  push:
    branches: [bootstrap, main]
  pull_request:
    branches: [bootstrap, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # 五平台回归矩阵(默认调度器 = worker 池)
  # macos-x64:arm64 runner 交叉编译 x86_64-apple-darwin,Rosetta 真跑套件。
  # ─────────────────────────────────────────────────────────────────────
  suite:
    name: suite (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64,   os: ubuntu-latest,    cc: clang, cxx: clang++, target: '',                   llvm: x86_64-unknown-linux-gnu }
          - { name: linux-arm64, os: ubuntu-24.04-arm, cc: clang, cxx: clang++, target: '',                   llvm: aarch64-unknown-linux-gnu }
          - { name: macos-arm64, os: macos-latest,      cc: clang, cxx: clang++, target: '',                   llvm: aarch64-apple-darwin }
          - { name: macos-x64,   os: macos-latest,      cc: clang, cxx: clang++, target: x86_64-apple-darwin,  llvm: x86_64-apple-darwin }
          - { name: windows-x64, os: windows-latest,    cc: cl,    cxx: cl,      target: '',                   llvm: x86_64-pc-windows-msvc }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}

    steps:
      # 本地 action 的元数据在自身步骤执行前解析——Frond 仓必须先于
      # `uses` 检出(workspace 根 = $GITHUB_WORKSPACE,Frond 在子目录)。
      - uses: actions/checkout@v5
        with:
          path: Frond
      - id: setup
        uses: ./Frond/.github/actions/setup-frond
        with:
          rust-target: ${{ matrix.target }}
          prefetch: true
          prefetch-triple: ${{ matrix.llvm }}

      - name: Functional suite
        shell: bash
        env: { FROND: '${{ steps.setup.outputs.frond-bin }}' }
        run: bash tests/scripts/run_functional.sh

      - name: Negative suite
        shell: bash
        env: { FROND: '${{ steps.setup.outputs.frond-bin }}' }
        run: bash tests/negative/run.sh

      # 调度稳定性哨兵:历史上 Multi 模式挂死/抖动的专项电池。
      - name: await_loop stability battery (x30)
        shell: bash
        env: { FROND: '${{ steps.setup.outputs.frond-bin }}' }
        run: bash tests/scripts/await_loop_battery.sh 30

  # ─────────────────────────────────────────────────────────────────────
  # 事件循环灰度 soak(FROND_EVENTLOOP=1,确定性单线程调度器)
  # 与 suite 同矩阵同门禁——两调度器的行为等价性由同一口径持续验证。
  # ─────────────────────────────────────────────────────────────────────
  eventloop:
    name: eventloop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64,   os: ubuntu-latest,    cc: clang, cxx: clang++, target: '',                   llvm: x86_64-unknown-linux-gnu }
          - { name: linux-arm64, os: ubuntu-24.04-arm, cc: clang, cxx: clang++, target: '',                   llvm: aarch64-unknown-linux-gnu }
          - { name: macos-arm64, os: macos-latest,      cc: clang, cxx: clang++, target: '',                   llvm: aarch64-apple-darwin }
          - { name: macos-x64,   os: macos-latest,      cc: clang, cxx: clang++, target: x86_64-apple-darwin,  llvm: x86_64-apple-darwin }
          - { name: windows-x64, os: windows-latest,    cc: cl,    cxx: cl,      target: '',                   llvm: x86_64-pc-windows-msvc }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      FROND_EVENTLOOP: '1'

    steps:
      # 本地 action 的元数据在自身步骤执行前解析——Frond 仓必须先于
      # `uses` 检出(workspace 根 = $GITHUB_WORKSPACE,Frond 在子目录)。
      - uses: actions/checkout@v5
        with:
          path: Frond
      - id: setup
        uses: ./Frond/.github/actions/setup-frond
        with:
          rust-target: ${{ matrix.target }}
          prefetch: true
          prefetch-triple: ${{ matrix.llvm }}

      - name: Functional suite (event loop)
        shell: bash
        env: { FROND: '${{ steps.setup.outputs.frond-bin }}' }
        run: bash tests/scripts/run_functional.sh

      - name: await_loop stability battery (x50, event loop)
        shell: bash
        env: { FROND: '${{ steps.setup.outputs.frond-bin }}' }
        run: bash tests/scripts/await_loop_battery.sh 50

      # 事件循环下 frondc 差分逐字节对齐(镜像差分在该调度器下的强信号)。
      - name: diff load (event loop)
        shell: bash
        env: { FROND: '${{ steps.setup.outputs.frond-bin }}' }
        run: bash tests/scripts/diff_load.sh
        timeout-minutes: 30

  # ─────────────────────────────────────────────────────────────────────
  # 镜像差分(Rust 引擎 vs frondc,逐字节)— 四平台(macos-x64 走
  # Rosetta 与 macos-arm64 同二进制语义,不重复;重差分单列)。
  # ─────────────────────────────────────────────────────────────────────
  differential:
    name: differential (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64,   os: ubuntu-latest,    cc: clang, cxx: clang++ }
          - { name: linux-arm64, os: ubuntu-24.04-arm, cc: clang, cxx: clang++ }
          - { name: macos-arm64, os: macos-latest,      cc: clang, cxx: clang++ }
          - { name: windows-x64, os: windows-latest,    cc: cl,    cxx: cl }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}

    steps:
      # 本地 action 的元数据在自身步骤执行前解析——Frond 仓必须先于
      # `uses` 检出(workspace 根 = $GITHUB_WORKSPACE,Frond 在子目录)。
      - uses: actions/checkout@v5
        with:
          path: Frond
      - id: setup
        uses: ./Frond/.github/actions/setup-frond

      - name: diff lex (tokens)
        shell: bash
        env: { FROND: '${{ steps.setup.outputs.frond-bin }}' }
        run: bash tests/scripts/diff_lex.sh
        timeout-minutes: 30

      - name: diff ast
        shell: bash
        env: { FROND: '${{ steps.setup.outputs.frond-bin }}' }
        run: bash tests/scripts/diff_ast.sh
        timeout-minutes: 30

      - name: diff load (load-dump v1)
        shell: bash
        env: { FROND: '${{ steps.setup.outputs.frond-bin }}' }
        run: bash tests/scripts/diff_load.sh
        timeout-minutes: 30

  # 重差分(全语料批解析分钟级):linux-x64 单平台先覆盖。
  differential-heavy:
    name: differential-heavy (linux-x64)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CC: clang
      CXX: clang++
    steps:
      # 本地 action 的元数据在自身步骤执行前解析——Frond 仓必须先于
      # `uses` 检出(workspace 根 = $GITHUB_WORKSPACE,Frond 在子目录)。
      - uses: actions/checkout@v5
        with:
          path: Frond
      - id: setup
        uses: ./Frond/.github/actions/setup-frond

      - name: diff tyops
        shell: bash
        env: { FROND: '${{ steps.setup.outputs.frond-bin }}' }
        run: bash tests/scripts/diff_tyops.sh
        timeout-minutes: 45

      - name: diff sema
        shell: bash
        env: { FROND: '${{ steps.setup.outputs.frond-bin }}' }
        run: bash tests/scripts/diff_sema.sh
        timeout-minutes: 45

  # ─────────────────────────────────────────────────────────────────────
  # linux musl 静态链接套件(libc/分配器面差异的额外覆盖;LLVM 三套件
  # 因无 musl 发行物经 FROND_SKIP 跳过)
  # ─────────────────────────────────────────────────────────────────────
  suite-musl:
    name: suite (linux-x64-musl)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CC: clang
      CXX: clang++
      FROND_SKIP: crypto_primitives llvm_bind llvm_probe
      FROND: ${{ github.workspace }}/Frond/core/target/x86_64-unknown-linux-musl/release/frond

    steps:
      - uses: actions/checkout@v5
        with:
          path: Frond
      - uses: actions/checkout@v5
        with:
          repository: frond-lang/tests
          path: tests
      - uses: actions/checkout@v5
        with:
          repository: frond-lang/apps
          path: apps

      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Frond/core

      - name: Build engine (musl static)
        run: cargo build --release --target x86_64-unknown-linux-musl
        working-directory: Frond/core

      - name: Functional suite (musl)
        shell: bash
        run: bash tests/scripts/run_functional.sh

      - name: Negative suite (musl)
        shell: bash
        run: bash tests/negative/run.sh

  # ─────────────────────────────────────────────────────────────────────
  # windows-arm64 交叉构建(aarch64-pc-windows-msvc):仅验编译(build.rs
  # C 内核/蹦床表在第五平台的编译面);GH runner 无 ARM64 执行环境。
  # 实验性:runner VS 镜像的 ARM64 构建工具如缺失,此 job 允许失败。
  # ─────────────────────────────────────────────────────────────────────
  build-windows-arm64:
    name: build (windows-arm64)
    runs-on: windows-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      # 本地 action 的元数据在自身步骤执行前解析——Frond 仓必须先于
      # `uses` 检出(workspace 根 = $GITHUB_WORKSPACE,Frond 在子目录)。
      - uses: actions/checkout@v5
        with:
          path: Frond
      - id: setup
        uses: ./Frond/.github/actions/setup-frond
        with:
          rust-target: aarch64-pc-windows-msvc
          msvc-arch: amd64_arm64

      - name: Smoke-check artifact
        shell: bash
        run: |
          set -euxo pipefail
          bin="${{ steps.setup.outputs.frond-bin }}"
          test -f "$bin"
          file "$bin" || true
