# CI — 跨平台一致性的执法者(BOOTSTRAP_PLAN.md 4d):
#   五平台矩阵跑 functional + negative,linux-x64 跑差分门(tokens/ast/
#   load/tyops)。release.yml 只构建打包;同源同行为由本矩阵保证。
#
# 布局约定(与本地开发一致,scripts 以 ../../Frond/... 定位二进制):
#   <workspace>/Frond   本仓库(checkout 默认)
#   <workspace>/tests   frond-lang/tests
#   <workspace>/apps    frond-lang/apps(llvmfetch 预取 + 差分语料)
# 所有 runner 经 FROND 环境变量指定引擎二进制(脚本默认找 frond.exe)。

name: CI

on:
  push:
    branches: [bootstrap, main]
  pull_request:
    branches: [bootstrap, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # 五平台回归矩阵(镜像 release.yml 的 triple 列表)
  # ─────────────────────────────────────────────────────────────────────
  suite:
    name: suite (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64,   os: ubuntu-latest,    cc: clang, cxx: clang++ }
          - { name: linux-arm64, os: ubuntu-24.04-arm, cc: clang, cxx: clang++ }
          - { name: macos-arm64, os: macos-latest,      cc: clang, cxx: clang++ }
          - { name: windows-x64, os: windows-latest,    cc: cl,    cxx: cl }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      FROND: ${{ github.workspace }}/Frond/core/target/release/frond${{ matrix.os == 'windows-latest' && '.exe' || '' }}

    steps:
      - uses: actions/checkout@v5
        with:
          path: Frond
      - uses: actions/checkout@v5
        with:
          repository: frond-lang/tests
          path: tests
      - uses: actions/checkout@v5
        with:
          repository: frond-lang/apps
          path: apps

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Frond/core

      # build.rs 在此步把 std 的全部 @extern("C") C 原语编译进二进制——
      # Windows 分支(#if _WIN32)只有本步会真正编译到。
      - name: Build engine
        run: cargo build --release
        working-directory: Frond/core

      # run_functional.sh 每套件用 GNU timeout 包裹;macOS 出厂没有该命令。
      - name: Install GNU coreutils (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install coreutils
          echo "$(brew --prefix)/opt/coreutils/libexec/gnubin" >> "$GITHUB_PATH"

      # 工具链资产预取:curl 直拉一次,喂两个套件(llvm_bind 的统一逻辑名
      # 动态库 + llvm_probe 的动态库/lld/linkview)。不走 llvmfetch——自研
      # TLS 客户端对 github CDN 在部分 runner 上不稳(macos alert20 /
      # linux-x64 段错误),且 Windows 的 RUNNER_TEMP 是 D:\ 盘符路径,
      # MSYS tar 会把 "D:" 当远程主机;工作区相对路径无此问题。
      - name: Prefetch toolchain assets (llvm_bind + llvm_probe)
        shell: bash
        run: |
          set -euxo pipefail
          case "${{ matrix.name }}" in
            linux-x64)   triple=x86_64-unknown-linux-gnu ;;
            linux-arm64) triple=aarch64-unknown-linux-gnu ;;
            macos-arm64) triple=aarch64-apple-darwin ;;
            windows-x64) triple=x86_64-pc-windows-msvc ;;
            *)           triple=x86_64-apple-darwin ;;
          esac
          tmp="$(pwd)/.tmp-tc"
          rm -rf "$tmp" && mkdir -p "$tmp"
          curl -sL --retry 3 -o "$tmp/tc.tar.gz" \
            "https://github.com/frond-lang/llvm/releases/download/llvm-static-21.1.8/llvm-static-$triple.tar.gz"
          tar -xzf "$tmp/tc.tar.gz" -C "$tmp"
          root="$(find "$tmp" -maxdepth 2 -type d -name "llvm-static-$triple" | head -1)"
          test -n "$root"
          # crypto_primitives 读 <workspace>/.llvm-dist/llvm-static-<triple>.tar.gz
          mkdir -p .llvm-dist
          cp "$tmp/tc.tar.gz" ".llvm-dist/llvm-static-$triple.tar.gz"
          lib="$(find "$root/lib" -maxdepth 1 -name 'llvm.*' ! -name '*.lib' | head -1)"
          test -n "$lib"
          cp "$lib" tests/functional/llvm_bind/src/assets/llvm-native.bin
          dest="tests/functional/llvm_probe/assets/toolchain"
          mkdir -p "$dest/lib" "$dest/bin"
          cp "$lib" "$dest/lib/"
          cp "$root"/bin/lld* "$dest/bin/"
          cp -R "$root/linkview" "$dest/"
          cp "$root/VERSION" "$dest/"
          rm -rf "$tmp"

      - name: Functional suite
        shell: bash
        run: bash tests/scripts/run_functional.sh

      - name: Negative suite
        shell: bash
        run: bash tests/negative/run.sh

  # ─────────────────────────────────────────────────────────────────────
  # 差分门(Rust 引擎 vs frondc 镜像,逐字节)。重载:全语料批解析为
  # 分钟级,每步 timeout ≥ 30min(BOOTSTRAP_PLAN 五、工程要点);先只在
  # linux-x64 跑,Windows 的命令行长度上限已由脚本内部分批规避。
  # TODO(1E): diff_sema.sh 接入(六语料声明前缀口径,当前 6/6 绿)。
  # ─────────────────────────────────────────────────────────────────────
  differential:
    name: differential (linux-x64)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CC: clang
      CXX: clang++
      FROND: ${{ github.workspace }}/Frond/core/target/release/frond
    steps:
      - uses: actions/checkout@v5
        with:
          path: Frond
      - uses: actions/checkout@v5
        with:
          repository: frond-lang/tests
          path: tests
      - uses: actions/checkout@v5
        with:
          repository: frond-lang/apps
          path: apps

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Frond/core

      - name: Build engine
        run: cargo build --release
        working-directory: Frond/core

      - name: diff lex (tokens)
        run: bash tests/scripts/diff_lex.sh
        timeout-minutes: 30

      - name: diff ast
        run: bash tests/scripts/diff_ast.sh
        timeout-minutes: 30

      - name: diff load (load-dump v1)
        run: bash tests/scripts/diff_load.sh
        timeout-minutes: 30

      - name: diff tyops
        run: bash tests/scripts/diff_tyops.sh
        timeout-minutes: 30
